networks:
  pihole:
    name: pihole

services:
  pihole:
    container_name: pihole
    hostname: Pihole
    image: pihole/pihole:2025.03.0
    restart: unless-stopped
    networks:
      - pihole
    ports:
      - 0.0.0.0:53:53/udp     # Plain DNS UDP
      - 0.0.0.0:53:53/tcp     # Plain DNS TCP
    # - 0.0.0.0:123:123/udp   # NTP
    # - 0.0.0.0:67:67/udp     # DHCP IPv4 UDP
    # - 0.0.0.0:547:547/udp   # DHCP IPv6 UDP
      - 0.0.0.0:80:80/tcp     # HTTP Web Interface
    # - 0.0.0.0:443:443/tcp   # HTTPS Web Interface (selfsigned)
    # - 0.0.0.0:5353:5353/udp # Unbound
    # - 0.0.0.0:5353:5353/tcp # Unbound
    environment:
      - TZ=Europe/Berlin
      - FTLCONF_webserver_api_password=pihole
      - FTLCONF_dns_upstreams=127.0.0.1#5353
      - FTLCONF_dns_listeningMode=all
      - FTLCONF_dns_dnssec=true
      - FTLCONF_misc_etc_dnsmasq_d=true
      - FTLCONF_ntp_ipv4_active=false
      - FTLCONF_ntp_ipv6_active=false
      - FTLCONF_ntp_sync_active=false
      - FTLCONF_ntp_sync_server=pool.ntp.org
      - FTLCONF_resolver_resolveIPv4=true
      - FTLCONF_resolver_resolveIPv6=false
      - FTLCONF_webserver_port=80,443os
      - FTLCONF_misc_check_load=false
    cap_add:
      - NET_ADMIN
    volumes:
      - "./required/dnsmasq.d/10-pihole-dhcp.conf:/etc/dnsmasq.d/10-pihole-dhcp.conf"
      - "./required/dnsmasq.d/09-pihole-local-subdomains.conf:/etc/dnsmasq.d/09-pihole-local-subdomains.conf"
      - "./data/dnsmasq.d/:/etc/dnsmasq.d/"
      - "./data/pihole/:/etc/pihole/"
    healthcheck:
      test: "dig pi.hole @127.0.0.1 -p 53 || exit 1"
      start_period: 60s
      start_interval: 15s
      interval: 15s
      timeout: 5s
      retries: 3

  pihole-unbound:
    container_name: pihole-unbound
    image: l33tlamer/unbound-recursive:latest
    restart: unless-stopped
    network_mode: service:pihole
    environment:
      - TZ=Europe/Berlin
    volumes:
      - "./required/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf"
      - "./required/unbound/a-records.conf:/opt/unbound/etc/unbound/a-records.conf"
      - "./required/unbound/forward-records.conf:/opt/unbound/etc/unbound/forward-records.conf"
      - "./required/unbound/srv-records.conf:/opt/unbound/etc/unbound/srv-records.conf"
    healthcheck:
      test: "drill google.com @127.0.0.1 -p 5353 || exit 1"
      start_period: 60s
      start_interval: 15s
      interval: 15s
      timeout: 5s
      retries: 3
